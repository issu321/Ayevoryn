<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="tt dd">
<title id="tt">Business Intelligence</title>
<desc id="dd">Enterprise command center, analytics, revenue and market intelligence</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A1128"/><stop offset="1" stop-color="#0D1638"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .fl{stroke-dasharray:4 12;animation:dsh 6s linear infinite}
    @keyframes dsh{to{stroke-dashoffset:-160}}
    .pw{animation:pw 4.5s ease-in-out infinite}
    @keyframes pw{0%,100%{opacity:.35}50%{opacity:1}}
    text{font-family:'Segoe UI','Inter',Arial,sans-serif}
  </style>
</defs>
<rect x="1.5" y="1.5" width="797" height="337" rx="18" fill="url(#card)" stroke="#26407E" stroke-opacity="0.55"/>
<rect x="1.5" y="1.5" width="797" height="337" rx="18" fill="none" stroke="url(#acc)" stroke-opacity="0.30"/>
<text x="42" y="60" font-size="23" font-weight="650" fill="#E8EDFB">Business Intelligence</text>
<rect x="42" y="74" width="56" height="3" rx="1.5" fill="url(#acc)"/>
<text x="42" y="102" font-size="13.5" fill="#93A5CC">Enterprise command center, analytics, revenue and market intelligence</text>
<g transform="translate(400,205)">
  <ellipse rx="285" ry="86" fill="none" stroke="#26407E"/>
  <circle r="42" fill="#0B1330" stroke="url(#acc)" stroke-width="2" filter="url(#glow)"/>
  <text y="8" text-anchor="middle" font-size="21" font-weight="700" fill="#E8EDFB">BI</text>
  <line x1="0" y1="0" x2="285" y2="0" stroke="#26407E"/>
<circle cx="285" cy="0" r="11" fill="#0E1A3F" stroke="#3B82F6"/><circle class="pw" cx="285" cy="0" r="3.4" fill="#38BDF8" style="animation-delay:0.0s"/>
<line x1="0" y1="0" x2="143" y2="74" stroke="#26407E"/>
<circle cx="143" cy="74" r="11" fill="#0E1A3F" stroke="#3B82F6"/><circle class="pw" cx="143" cy="74" r="3.4" fill="#38BDF8" style="animation-delay:1.0s"/>
<line x1="0" y1="0" x2="-142" y2="74" stroke="#26407E"/>
<circle cx="-142" cy="74" r="11" fill="#0E1A3F" stroke="#3B82F6"/><circle class="pw" cx="-142" cy="74" r="3.4" fill="#38BDF8" style="animation-delay:2.0s"/>
<line x1="0" y1="0" x2="-285" y2="0" stroke="#26407E"/>
<circle cx="-285" cy="0" r="11" fill="#0E1A3F" stroke="#3B82F6"/><circle class="pw" cx="-285" cy="0" r="3.4" fill="#38BDF8" style="animation-delay:3.0s"/>
<line x1="0" y1="0" x2="-143" y2="-74" stroke="#26407E"/>
<circle cx="-143" cy="-74" r="11" fill="#0E1A3F" stroke="#3B82F6"/><circle class="pw" cx="-143" cy="-74" r="3.4" fill="#38BDF8" style="animation-delay:4.0s"/>
<line x1="0" y1="0" x2="143" y2="-74" stroke="#26407E"/>
<circle cx="143" cy="-74" r="11" fill="#0E1A3F" stroke="#3B82F6"/><circle class="pw" cx="143" cy="-74" r="3.4" fill="#38BDF8" style="animation-delay:5.0s"/>

  <circle r="4" fill="#22D3EE" filter="url(#glow)">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 285 0 A 285 86 0 1 1 -285 0 A 285 86 0 1 1 285 0"/>
  </circle>
</g>
</svg>
