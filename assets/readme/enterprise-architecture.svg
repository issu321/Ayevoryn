<text x="112" y="267" font-size="12" letter-spacing="3" fill="#8B5CF6">SERVICES</text>
<text x="250" y="267" font-size="11.5" fill="#7E93C4">twins · simulation · forecasting · risk · events</text>
<rect x="90" y="294" width="620" height="44" rx="10" fill="#0B1330" stroke="#334155" stroke-opacity="0.55"/>
