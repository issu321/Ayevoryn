<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="tt dd">
<title id="tt">Deployment Topology</title>
<desc id="dd">Reproducible Docker builds, Gunicorn WSGI workers and persistent data volumes</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A1128"/><stop offset="1" stop-color="#0D1638"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .fl{stroke-dasharray:4 12;animation:dsh 6s linear infinite}
    @keyframes dsh{to{stroke-dashoffset:-160}}
    .pw{animation:pw 4.5s ease-in-out infinite}
    @keyframes pw{0%,100%{opacity:.35}50%{opacity:1}}
    text{font-family:'Segoe UI','Inter',Arial,sans-serif}
  </style>
</defs>
<rect x="1.5" y="1.5" width="797" height="337" rx="18" fill="url(#card)" stroke="#26407E" stroke-opacity="0.55"/>
<rect x="1.5" y="1.5" width="797" height="337" rx="18" fill="none" stroke="url(#acc)" stroke-opacity="0.30"/>
<text x="42" y="60" font-size="23" font-weight="650" fill="#E8EDFB">Deployment Topology</text>
<rect x="42" y="74" width="56" height="3" rx="1.5" fill="url(#acc)"/>
<text x="42" y="102" font-size="13.5" fill="#93A5CC">Reproducible Docker builds, Gunicorn WSGI workers and persistent data volumes</text>
<g font-size="10" letter-spacing="2" text-anchor="middle" fill="#8FA9E8">
  <rect x="70" y="180" width="110" height="80" rx="12" fill="#0E1A3F" stroke="#3B82F6"/>
  <text x="125" y="266">SOURCE</text>
  <rect x="250" y="180" width="150" height="80" rx="12" fill="#0E1A3F" stroke="#38BDF8"/>
  <text x="325" y="266">DOCKER IMAGE</text>
