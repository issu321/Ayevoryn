<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="tt dd">
<title id="tt">Business Digital Twins</title>
<desc id="dd">Live computational models mirroring departments, customers, employees, finance and supply chain</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A1128"/><stop offset="1" stop-color="#0D1638"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .fl{stroke-dasharray:4 12;animation:dsh 6s linear infinite}
    @keyframes dsh{to{stroke-dashoffset:-160}}
    .pw{animation:pw 4.5s ease-in-out infinite}
    @keyframes pw{0%,100%{opacity:.35}50%{opacity:1}}
    text{font-family:'Segoe UI','Inter',Arial,sans-serif}
  </style>
</defs>
<rect x="1.5" y="1.5" width="797" height="337" rx="18" fill="url(#card)" stroke="#26407E" stroke-opacity="0.55"/>
<rect x="1.5" y="1.5" width="797" height="337" rx="18" fill="none" stroke="url(#acc)" stroke-opacity="0.30"/>
<text x="42" y="60" font-size="23" font-weight="650" fill="#E8EDFB">Business Digital Twins</text>
<rect x="42" y="74" width="56" height="3" rx="1.5" fill="url(#acc)"/>
<text x="42" y="102" font-size="13.5" fill="#93A5CC">Live computational models mirroring departments, customers, employees, finance and supply chain</text>
<g font-size="10" letter-spacing="2" text-anchor="middle">
  <text x="220" y="140" fill="#7DD3FC">SOURCE SYSTEM</text>
  <text x="580" y="140" fill="#C4B5FD">AYEVORYN TWIN</text>
</g>
<rect x="120" y="152" width="200" height="112" rx="14" fill="#0E1A3F" stroke="#3B82F6" stroke-opacity="0.8"/>
<rect x="480" y="152" width="200" height="112" rx="14" fill="#101A45" stroke="#8B5CF6" stroke-opacity="0.9"/>
<g fill="#27407E">
  <rect x="140" y="176" width="120" height="10" rx="3"/>
  <rect x="140" y="196" width="150" height="10" rx="3"/>
  <rect x="140" y="216" width="96" height="10" rx="3"/>
  <rect x="140" y="236" width="132" height="10" rx="3"/>
</g>
<g fill="none" stroke="#22D3EE" stroke-width="1.4" class="pw">
  <rect x="500" y="176" width="120" height="10" rx="3"/>
  <rect x="500" y="196" width="150" height="10" rx="3"/>
  <rect x="500" y="216" width="96" height="10" rx="3"/>
  <rect x="500" y="236" width="132" height="10" rx="3"/>
</g>
<line x1="400" y1="140" x2="400" y2="280" stroke="#38BDF8" stroke-width="2" class="fl"/>
<path d="M400 138 l-7 12 h14 z" fill="#38BDF8"/>
<path d="M400 282 l-7 -12 h14 z" fill="#38BDF8"/>
<circle cx="400" cy="208" r="7" fill="#0B1330" stroke="url(#acc)" stroke-width="2" filter="url(#glow)">
  <animate attributeName="r" values="6;9;6" dur="3.5s" repeatCount="indefinite"/>
</circle>
</svg>
