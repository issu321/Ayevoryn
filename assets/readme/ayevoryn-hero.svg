<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
  <title id="t">Ayevoryn — The intelligence layer for the business itself</title>
  <desc id="d">Animated banner: a glowing business-intelligence network surrounding the Ayevoryn emblem on a midnight-navy technical grid.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#101A3D"/>
      <stop offset="55%" stop-color="#080D22"/>
      <stop offset="100%" stop-color="#04060F"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="45%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#24407A" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow{stroke-dasharray:5 16;animation:dash 7s linear infinite}
      .flow2{stroke-dasharray:4 14;animation:dash 10s linear infinite reverse}
      @keyframes dash{to{stroke-dashoffset:-210}}
      .tw{animation:tw 5s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
      text{font-family:'Segoe UI','Inter',Arial,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="500" fill="url(#bgGlow)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <ellipse cx="600" cy="472" rx="520" ry="130" fill="#1D2B6B" opacity="0.22" filter="url(#soft)"/>

  <circle cx="140" cy="90" r="120" fill="#3B82F6" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1070" cy="110" r="140" fill="#8B5CF6" opacity="0.10" filter="url(#soft)"/>
  <circle cx="980" cy="420" r="110" fill="#22D3EE" opacity="0.08" filter="url(#soft)"/>

  <g stroke="#27489B" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M120 210 C 260 150, 380 120, 600 150"/>
    <path d="M1080 200 C 940 150, 820 120, 600 150"/>
    <path d="M180 380 C 330 330, 470 300, 600 250"/>
    <path d="M1020 390 C 870 330, 730 300, 600 250"/>
    <path d="M120 210 C 200 300, 150 340, 180 380"/>
    <path d="M1080 200 C 1000 300, 1050 350, 1020 390"/>
    <path d="M320 90 C 420 60, 780 60, 880 92"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path class="flow" d="M120 210 C 260 150, 380 120, 600 150" stroke="#38BDF8" stroke-width="2"/>
    <path class="flow2" d="M1080 200 C 940 150, 820 120, 600 150" stroke="#A78BFA" stroke-width="2"/>
    <path class="flow" d="M180 380 C 330 330, 470 300, 600 250" stroke="#22D3EE" stroke-width="2"/>
    <path class="flow2" d="M1020 390 C 870 330, 730 300, 600 250" stroke="#60A5FA" stroke-width="2"/>
  </g>

  <g filter="url(#soft)">
    <circle class="tw" cx="120" cy="210" r="5" fill="#38BDF8"/>
    <circle class="tw" cx="1080" cy="200" r="5" fill="#A78BFA" style="animation-delay:1s"/>
    <circle class="tw" cx="180" cy="380" r="5" fill="#22D3EE" style="animation-delay:2s"/>
    <circle class="tw" cx="1020" cy="390" r="5" fill="#60A5FA" style="animation-delay:.5s"/>
    <circle class="tw" cx="320" cy="90" r="4" fill="#818CF8" style="animation-delay:1.6s"/>
    <circle class="tw" cx="880" cy="92" r="4" fill="#67E8F9" style="animation-delay:2.4s"/>
  </g>

  <g>
    <circle cx="600" cy="150" r="66" fill="#0A1029" stroke="url(#ring)" stroke-width="2.5"/>
    <circle cx="600" cy="150" r="78" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 10">
      <animateTransform attributeName="transform" type="rotate" from="0 600 150" to="360 600 150" dur="16s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="173" text-anchor="middle" font-size="58" font-weight="700" fill="url(#head)">A</text>
    <circle cx="600" cy="72" r="3.4" fill="#22D3EE">
      <animateTransform attributeName="transform" type="rotate" from="0 600 150" to="360 600 150" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="298" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="16" fill="url(#head)">AYEVORYN</text>
  <text x="600" y="336" text-anchor="middle" font-size="15" letter-spacing="6" fill="#7DD3FC">THE INTELLIGENCE LAYER FOR THE BUSINESS ITSELF</text>
  <g stroke="#2A4A9E" stroke-width="1"><path d="M380 360 H560"/><path d="M640 360 H820"/></g>
  <circle cx="600" cy="360" r="2.6" fill="#22D3EE"/>
  <text x="600" y="394" text-anchor="middle" font-size="15.5" font-style="italic" fill="#A9B8DC">"The world builds software around businesses. Ayevoryn is built around the business itself."</text>

  <g font-size="11" letter-spacing="3" fill="#8FB4F5">
    <rect x="322" y="424" rx="13" width="164" height="26" fill="#0D1638" stroke="#2A4A9E"/>
    <text x="404" y="441" text-anchor="middle">DIGITAL TWINS</text>
    <rect x="502" y="424" rx="13" width="186" height="26" fill="#0D1638" stroke="#2A4A9E"/>
    <text x="595" y="441" text-anchor="middle">DECISION INTELLIGENCE</text>
    <rect x="704" y="424" rx="13" width="174" height="26" fill="#0D1638" stroke="#2A4A9E"/>
    <text x="791" y="441" text-anchor="middle">BUSINESS SIMULATION</text>
  </g>
</svg>
