<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="tt dd">
<title id="tt">Decision Intelligence</title>
<desc id="dd">Scenario definition, impact propagation, risk evaluation and decision tracing</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A1128"/><stop offset="1" stop-color="#0D1638"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .fl{stroke-dasharray:4 12;animation:dsh 6s linear infinite}
    @keyframes dsh{to{stroke-dashoffset:-160}}
    .pw{animation:pw 4.5s ease-in-out infinite}
    @keyframes pw{0%,100%{opacity:.35}50%{opacity:1}}
    text{font-family:'Segoe UI','Inter',Arial,sans-serif}
  </style>
</defs>
<rect x="1.5" y="1.5" width="797" height="337" rx="18" fill="url(#card)" stroke="#26407E" stroke-opacity="0.55"/>
<rect x="1.5" y="1.5" width="797" height="337" rx="18" fill="none" stroke="url(#acc)" stroke-opacity="0.30"/>
<text x="42" y="60" font-size="23" font-weight="650" fill="#E8EDFB">Decision Intelligence</text>
<rect x="42" y="74" width="56" height="3" rx="1.5" fill="url(#acc)"/>
<text x="42" y="102" font-size="13.5" fill="#93A5CC">Scenario definition, impact propagation, risk evaluation and decision tracing</text>
<circle cx="96" cy="205" r="20" fill="#0E1A3F" stroke="#3B82F6"/>
<circle cx="96" cy="205" r="4" fill="#38BDF8"/>
<line x1="116" y1="205" x2="180" y2="205" stroke="#26407E" stroke-width="1.4" class="fl"/>
<polygon points="180,200 192,205 180,210" fill="#38BDF8"/>
<polygon points="260,128 336,205 260,282 184,205" fill="#0B1330" stroke="url(#acc)" stroke-width="2" filter="url(#glow)"/>
<polygon points="260,156 308,205 260,254 212,205" fill="none" stroke="#26407E"/>
<g fill="none" stroke-width="2">
  <path class="fl" d="M336 205 C 420 165, 500 140, 588 138" stroke="#38BDF8"/>
  <path class="fl" d="M336 205 C 440 205, 500 205, 588 205" stroke="#A78BFA" style="animation-delay:.8s"/>
  <path class="fl" d="M336 205 C 420 245, 500 270, 588 272" stroke="#22D3EE" style="animation-delay:1.6s"/>
</g>
<g font-size="11" letter-spacing="2" text-anchor="middle">
  <circle cx="614" cy="138" r="24" fill="#0E1A3F" stroke="#38BDF8"/><text x="614" y="142" fill="#BAE6FD">IMPACT</text>
  <circle cx="614" cy="205" r="24" fill="#0E1A3F" stroke="#A78BFA"/><text x="614" y="209" fill="#DDD6FE">RISK</text>
  <circle cx="614" cy="272" r="24" fill="#0E1A3F" stroke="#22D3EE"/><text x="614" y="276" fill="#A5F3FC">OUTCOME</text>
</g>
</svg>
